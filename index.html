<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>目黒なずな — 短歌アーカイブ</title>
<meta name="description" content="目黒なずな 短歌アーカイブ">
<meta name="theme-color" content="#0a0a0c">
<link rel="canonical" href="https://tanka.h4lmiran.com/">
<meta property="og:title" content="目黒なずな">
<meta property="og:description" content="目黒なずな 短歌アーカイブ">
<meta property="og:image" content="https://tanka.h4lmiran.com/ogp.png">
<meta property="og:url" content="https://tanka.h4lmiran.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://tanka.h4lmiran.com/ogp.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  .liquid { position: absolute; inset: 0; width: 100%; height: 100lvh; opacity: 0; transition: opacity 1.6s ease; }
  .liquid.is-on { opacity: 1; }
</style>
</head>
<body>
<a class="skip" href="#list">歌の一覧へ移動</a>

<div class="stage" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="rail" aria-hidden="true"><i></i></div>

<div class="wrap">
  <header class="hero">
    <div class="hero-top">
      <span>Tanka Archive</span>
      <span>Meguro Nazuna</span>
    </div>
    <h1 class="hero-title" id="heroTitle">目黒なずな</h1>
    <div class="hero-lede">
      <span class="hero-count" id="heroCount">—<small>首</small></span>
      <p class="hero-range" id="heroRange"></p>
    </div>
    <a class="hero-cue" href="#list">Scroll</a>
  </header>

  <section class="controls" aria-label="絞り込み">
    <div class="controls-inner">
      <div class="search">
        <label for="searchInput">Search</label>
        <input type="search" id="searchInput" placeholder="ことばで歌をさがす" autocomplete="off">
      </div>
      <div class="controls-row">
        <fieldset class="filters">
          <legend>Series</legend>
          <div class="pills" id="pillContainer"></div>
        </fieldset>
        <div class="sort">
          <label for="sortSelect">Order</label>
          <select id="sortSelect">
            <option value="date-desc">新しい順</option>
            <option value="date-asc">古い順</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <main id="list" tabindex="-1">
    <p class="count" id="countLabel" aria-live="polite"></p>
    <ul class="tanka-list" id="tankaList"></ul>
  </main>

  <footer>
    <span>© 目黒なずな</span>
    <a href="https://x.com/72831s" target="_blank" rel="noopener">@72831s</a>
  </footer>
</div>

<script src="assets/spiral.js"></script>
<script src="assets/app.js"></script>
<script src="assets/bg-webgl.js"></script>
</body>
</html>
